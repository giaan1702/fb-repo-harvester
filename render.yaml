services:
  - type: web
    name: autonomous-knowledge-vault
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 7860
      - key: RMKO_GATEWAY_URL
        value: https://rmko-gateway.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCOUT_ENABLED
        value: "true"
      - key: SCOUT_INTERVAL_SECONDS
        value: "14400"

